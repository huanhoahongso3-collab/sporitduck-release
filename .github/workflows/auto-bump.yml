name: Auto-bump SpotiDuck base APK

on:
  schedule:
    - cron: '0 3 * * 1'   # Every Monday 03:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download apktool
        run: |
          mkdir -p tmp
          curl -fL -o tmp/apktool.jar \
            https://github.com/iBotPeaches/Apktool/releases/download/v2.12.1/apktool_2.12.1.jar

      - name: Download latest SpotiDuck beta APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The release asset filename embeds a version+commit hash that changes every
          # release (e.g. SpotiDuck-v1.2.2-3d2c473.apk), so it can't be hardcoded —
          # resolve whatever *.apk is actually attached to the latest-beta tag instead.
          mkdir -p tmp
          gh release download latest-beta \
            --repo 23fpsz/SpotiDuck-Releases \
            --pattern '*.apk' \
            --dir tmp \
            --clobber
          mv tmp/*.apk tmp/SpotiDuck-upstream.apk

      - name: Decode upstream APK
        run: |
          java -jar tmp/apktool.jar d tmp/SpotiDuck-upstream.apk \
            -o tmp/SpotiDuck-upstream-decoded \
            --force

      - name: Check for upstream smali changes (excluding our patch package)
        id: diff_check
        run: |
          # Hash all smali files except our own patch package
          find tmp/SpotiDuck-upstream-decoded/smali \
            -name "*.smali" \
            ! -path "*/dhp/vkn/tpl/sporitduck/*" \
            | sort | xargs md5sum > tmp/upstream.md5

          find SpotiDuck-decoded/smali \
            -name "*.smali" \
            ! -path "*/dhp/vkn/tpl/sporitduck/*" \
            | sort | xargs md5sum > tmp/current.md5

          if diff -q tmp/upstream.md5 tmp/current.md5 > /dev/null 2>&1; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Overlay upstream smali onto our decoded tree
        if: steps.diff_check.outputs.changed == 'true'
        run: |
          # Copy every non-patch file from upstream over the current decoded tree
          rsync -a --exclude="dhp/vkn/tpl/sporitduck/" \
            tmp/SpotiDuck-upstream-decoded/smali/ \
            SpotiDuck-decoded/smali/

          # Sync resources and root files that may also change. AndroidManifest.xml is
          # excluded: it's a single shared file where our own Xposed module declarations
          # (meta-data, the ModuleSettingsActivity/PrefsProvider entries, DnsAdBlock's
          # permissions, etc.) live alongside Spotify's own — an unconditional overwrite
          # would silently delete all of that. It's copied aside instead so a maintainer
          # can diff and merge it by hand when upstream actually changes it.
          rsync -a --exclude="smali/" --exclude="AndroidManifest.xml" \
            tmp/SpotiDuck-upstream-decoded/ \
            SpotiDuck-decoded/

          if ! diff -q tmp/SpotiDuck-upstream-decoded/AndroidManifest.xml \
                       SpotiDuck-decoded/AndroidManifest.xml > /dev/null 2>&1; then
            cp tmp/SpotiDuck-upstream-decoded/AndroidManifest.xml \
               SpotiDuck-decoded/AndroidManifest.xml.upstream
            echo "manifest_changed=true" >> "$GITHUB_ENV"
          fi

      - name: Commit updated base
        if: steps.diff_check.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SpotiDuck-decoded/
          MSG="chore: bump SpotiDuck base APK (auto-bump $(date -u +%Y-%m-%d))"
          if [ "${manifest_changed:-}" = "true" ]; then
            MSG="$MSG

upstream AndroidManifest.xml changed — left as AndroidManifest.xml.upstream
for manual review/merge, our own copy was NOT overwritten."
          fi
          git commit -m "$MSG"
          git push
